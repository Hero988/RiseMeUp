<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" role="img" aria-labelledby="water-title water-desc"><title id="water-title">Proposed water pathway from seven wells through reservoir storage to ten greenhouses</title><desc id="water-desc">Seven existing wells with replacement pumps feed a new reservoir. Water passes through a filter and pressure controls into a closed pipe network. Valves control drip irrigation for each of ten planned greenhouses. Locations and sizes are illustrative.</desc><style>text{font-family:Arial,sans-serif;fill:#294b38}.label{font-size:20px;font-weight:bold}.small{font-size:15px}.tiny{font-size:13px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#509ab1"/></marker></defs>
<rect x="12" y="18" width="1076" height="258" rx="20" fill="#eef2e7"/><text x="38" y="56" class="label">1. Restore pumping</text><text x="375" y="56" class="label">2. Store water</text><text x="748" y="56" class="label">3. Filter &amp; control</text><g transform="translate(55 120)"><ellipse cx="22" cy="0" rx="21" ry="8" fill="#d1ddcd" stroke="#43654b" stroke-width="2"/><path d="M1 0v24c0 11 42 11 42 0V0" fill="#edf1e8" stroke="#43654b" stroke-width="2"/><path d="M22-18v20" stroke="#bd692f" stroke-width="4"/><text x="22" y="48" text-anchor="middle" class="tiny">Well 1</text></g><g transform="translate(118 120)"><ellipse cx="22" cy="0" rx="21" ry="8" fill="#d1ddcd" stroke="#43654b" stroke-width="2"/><path d="M1 0v24c0 11 42 11 42 0V0" fill="#edf1e8" stroke="#43654b" stroke-width="2"/><path d="M22-18v20" stroke="#bd692f" stroke-width="4"/><text x="22" y="48" text-anchor="middle" class="tiny">Well 2</text></g><g transform="translate(181 120)"><ellipse cx="22" cy="0" rx="21" ry="8" fill="#d1ddcd" stroke="#43654b" stroke-width="2"/><path d="M1 0v24c0 11 42 11 42 0V0" fill="#edf1e8" stroke="#43654b" stroke-width="2"/><path d="M22-18v20" stroke="#bd692f" stroke-width="4"/><text x="22" y="48" text-anchor="middle" class="tiny">Well 3</text></g><g transform="translate(244 120)"><ellipse cx="22" cy="0" rx="21" ry="8" fill="#d1ddcd" stroke="#43654b" stroke-width="2"/><path d="M1 0v24c0 11 42 11 42 0V0" fill="#edf1e8" stroke="#43654b" stroke-width="2"/><path d="M22-18v20" stroke="#bd692f" stroke-width="4"/><text x="22" y="48" text-anchor="middle" class="tiny">Well 4</text></g><g transform="translate(55 192)"><ellipse cx="22" cy="0" rx="21" ry="8" fill="#d1ddcd" stroke="#43654b" stroke-width="2"/><path d="M1 0v24c0 11 42 11 42 0V0" fill="#edf1e8" stroke="#43654b" stroke-width="2"/><path d="M22-18v20" stroke="#bd692f" stroke-width="4"/><text x="22" y="48" text-anchor="middle" class="tiny">Well 5</text></g><g transform="translate(118 192)"><ellipse cx="22" cy="0" rx="21" ry="8" fill="#d1ddcd" stroke="#43654b" stroke-width="2"/><path d="M1 0v24c0 11 42 11 42 0V0" fill="#edf1e8" stroke="#43654b" stroke-width="2"/><path d="M22-18v20" stroke="#bd692f" stroke-width="4"/><text x="22" y="48" text-anchor="middle" class="tiny">Well 6</text></g><g transform="translate(181 192)"><ellipse cx="22" cy="0" rx="21" ry="8" fill="#d1ddcd" stroke="#43654b" stroke-width="2"/><path d="M1 0v24c0 11 42 11 42 0V0" fill="#edf1e8" stroke="#43654b" stroke-width="2"/><path d="M22-18v20" stroke="#bd692f" stroke-width="4"/><text x="22" y="48" text-anchor="middle" class="tiny">Well 7</text></g>
