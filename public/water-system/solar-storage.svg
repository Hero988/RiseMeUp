<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="solar-diagram-title"><title id="solar-diagram-title">Solar panels power pumps and charge a proposed battery. Pumps fill the reservoir, which supplies greenhouse irrigation. Battery loads remain to be specified.</title><defs><marker id="solar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52745d"/></marker></defs><g fill="#fffdf8" stroke="#9db391" stroke-width="2"><rect x="10" y="18" width="190" height="75" rx="14"/><rect x="255" y="18" width="150" height="75" rx="14"/><rect x="460" y="18" width="180" height="75" rx="14" fill="#dcecf0"/><rect x="695" y="18" width="195" height="75" rx="14"/><rect x="10" y="145" width="340" height="65" rx="14"/></g><g fill="none" stroke="#52745d" stroke-width="3" marker-end="url(#solar-arrow)"><path d="M200 55H250"/><path d="M405 55H455"/><path d="M640 55H690"/><path d="M100 93V140"/></g><g fill="#294b38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18"><text x="105" y="50">Solar panels</text><text x="105" y="74" font-size="13">Controllers &amp; protection</text><text x="330" y="50">Well pumps</text><text x="330" y="74" font-size="13">Seven wells to assess</text><text x="550" y="50">Water reservoir</text><text x="550" y="74" font-size="13">Stores irrigation water</text><text x="792" y="50">10 greenhouses</text><text x="792" y="74" font-size="13">Filter • pressure • drip</text><text x="180" y="172">Proposed battery storage</text><text x="180" y="194" font-size="13">Stores electricity • loads &amp; capacity to assess</text></g><text x="390" y="174" fill="#53664d" font-family="Arial,sans-serif" font-size="14">Daylight pumping fills the water reserve.</text><text x="390" y="197" fill="#53664d" font-family="Arial,sans-serif" font-size="14">Diagram shows the concept, not wiring or pipe design.</text></svg>